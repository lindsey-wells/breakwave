name: BreakWave Shadow CI

run-name: ${{ github.event_name == 'push' && github.event.head_commit.message || inputs.run_label || format('BreakWave Shadow CI — {0}', github.ref_name) }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BREAKWAVE_FLUTTER_VERSION: '3.44.9'

on:
  push:
    branches:
      - 'validation/bw-*'
  workflow_dispatch:
    inputs:
      run_label:
        description: 'Optional BW mission label shown in Actions'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: breakwave-shadow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shadow-verify:
    name: Shadow Verify, Analyze, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive Shadow metadata
        id: shadow_metadata
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          stage_id="$(printf '%s\n' "$subject" | grep -oE 'BW-[A-Z0-9]+(-[A-Z0-9]+)+' | head -n 1 || true)"
          if [ -z "$stage_id" ]; then
            stage_id="BW-SHADOW"
          fi
          artifact_prefix="$(printf '%s' "$stage_id" | tr '[:upper:]' '[:lower:]')"
          echo "stage_id=$stage_id" >> "$GITHUB_OUTPUT"
          echo "artifact_prefix=$artifact_prefix" >> "$GITHUB_OUTPUT"
          echo "BW_SHADOW_STAGE_ID=$stage_id" >> "$GITHUB_ENV"
          echo "Shadow stage: $stage_id"
          echo "Artifact prefix: $artifact_prefix"

      - name: BreakWaveVerify engine preflight
        run: python3 tools/breakwave_verify.py selftest

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.BREAKWAVE_FLUTTER_VERSION }}
          cache: true

      - name: Verify pinned Flutter version
        shell: bash
        run: |
          set -euo pipefail
          flutter --version | tee /tmp/breakwave_flutter_version.txt
          grep -F "Flutter ${BREAKWAVE_FLUTTER_VERSION}" /tmp/breakwave_flutter_version.txt

      - name: Prepare Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No signing secrets found; repository fallback remains active."
            exit 0
          fi
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Run complete Shadow verification
        run: python3 .github/scripts/run_breakwave_shadow_ci.py

      - name: Capture resolved dependency lock
        shell: bash
        run: |
          set -euo pipefail
          test -s pubspec.lock
          mkdir -p shadow_evidence
          cp pubspec.lock shadow_evidence/pubspec.lock.resolved
          sha256sum pubspec.lock > shadow_evidence/pubspec.lock.resolved.sha256

      - name: Upload Shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.shadow_metadata.outputs.artifact_prefix }}-shadow-evidence
          path: shadow_evidence/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload Shadow APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.shadow_metadata.outputs.artifact_prefix }}-shadow-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload Shadow AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.shadow_metadata.outputs.artifact_prefix }}-shadow-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
          retention-days: 3
