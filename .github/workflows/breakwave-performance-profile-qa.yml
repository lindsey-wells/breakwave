name: BreakWave Performance Profile QA

run-name: BreakWave Performance Profile QA — ${{ github.ref_name }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BREAKWAVE_FLUTTER_VERSION: '3.44.9'

on:
  push:
    branches:
      - perf/perf02d-first-frame-investigation

permissions:
  contents: read

concurrency:
  group: breakwave-performance-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profile-qa:
    name: Verify + Build Profile QA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact PERF-02D commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.BREAKWAVE_FLUTTER_VERSION }}
          cache: true

      - name: Verify pinned Flutter version
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter --version | grep -F "Flutter ${BREAKWAVE_FLUTTER_VERSION}"

      - name: Require Test Store public SDK key
        shell: bash
        env:
          TEST_STORE_PUBLIC_SDK_KEY: ${{ secrets.BREAKWAVE_REVENUECAT_TEST_STORE_PUBLIC_SDK_KEY }}
        run: |
          set -euo pipefail
          test -n "$TEST_STORE_PUBLIC_SDK_KEY"
          echo "Test Store public SDK key is configured."

      - name: Install dependencies
        run: flutter pub get

      - name: Verify PERF-02D profile isolation contract
        run: |
          set -euo pipefail
          python3 tools/verify_bw_wp03vt2.py
          python3 tools/verify_bw_perf02d_profile.py

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build isolated profile QA APK
        shell: bash
        env:
          TEST_STORE_PUBLIC_SDK_KEY: ${{ secrets.BREAKWAVE_REVENUECAT_TEST_STORE_PUBLIC_SDK_KEY }}
          ORG_GRADLE_PROJECT_breakwaveTestStoreQa: 'true'
        run: |
          set -euo pipefail

          DEFINE_FILE="$RUNNER_TEMP/breakwave-profile-defines.json"
          cleanup() {
            rm -f -- "$DEFINE_FILE"
          }
          trap cleanup EXIT

          python3 - "$DEFINE_FILE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          key = os.environ.get("TEST_STORE_PUBLIC_SDK_KEY", "")
          if not key:
              raise SystemExit("Test Store public SDK key missing.")

          Path(sys.argv[1]).write_text(
              json.dumps(
                  {
                      "BREAKWAVE_REVENUECAT_TEST_STORE_QA": "true",
                      "BREAKWAVE_REVENUECAT_ANDROID_PUBLIC_SDK_KEY": key,
                  }
              ),
              encoding="utf-8",
          )
          os.chmod(sys.argv[1], 0o600)
          PY

          flutter build apk \
            --profile \
            --dart-define-from-file="$DEFINE_FILE"

          cleanup
          trap - EXIT

      - name: Verify isolated profile APK identity
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-profile.apk"
          test -s "$APK"

          AAPT="$(
            find "$ANDROID_SDK_ROOT/build-tools" \
              -type f -name aapt -perm -111 |
            sort -V |
            tail -n 1
          )"
          test -x "$AAPT"

          mkdir -p performance_profile_qa_evidence
          "$AAPT" dump badging "$APK" \
            > performance_profile_qa_evidence/aapt_badging.txt

          grep -F "package: name='com.cube23.breakwave.teststoreqa'" \
            performance_profile_qa_evidence/aapt_badging.txt

          grep -F "application-label:'BreakWave Test Store'" \
            performance_profile_qa_evidence/aapt_badging.txt

          if grep -F "package: name='com.cube23.breakwave'" \
              performance_profile_qa_evidence/aapt_badging.txt; then
            echo "::error::Profile QA artifact resolved to production package ID."
            exit 1
          fi

          sha256sum "$APK" \
            > performance_profile_qa_evidence/apk.sha256

      - name: Write profile QA evidence metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p performance_profile_qa_evidence

          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          payload = {
              "branch": os.environ.get("GITHUB_REF_NAME", ""),
              "commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "qa_flag": True,
              "application_id": "com.cube23.breakwave.teststoreqa",
              "application_label": "BreakWave Test Store",
              "build_mode": "profile",
              "debug_build": False,
              "release_build": False,
              "aab_built": False,
              "production_signing_secrets_used": False,
              "artifact_purpose": "PERF-02D profile-mode device timing only",
          }

          Path("performance_profile_qa_evidence/summary.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload profile QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breakwave-performance-profile-qa-evidence
          path: performance_profile_qa_evidence/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload profile QA APK
        uses: actions/upload-artifact@v4
        with:
          name: breakwave-performance-profile-qa-apk
          path: build/app/outputs/flutter-apk/app-profile.apk
          if-no-files-found: error
          retention-days: 7
